name: linter

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Checks only: the job fails when code is not formatted or has lint/type errors.
      - name: PHP Code Style (Pint)
        run: vendor/bin/pint --test

      - name: Frontend Formatting (Prettier)
        run: npm run format:check

      - name: Frontend Lint (ESLint)
        run: npx eslint .

      - name: TypeScript
        run: npx tsc --noEmit
